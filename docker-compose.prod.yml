services:
  database:
    image: postgres:16-alpine
    container_name: med_bio_db_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medical_biosecurity}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
    volumes:
      - ./database/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-medical_biosecurity}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - med_bio_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: med_bio_backend_prod
    restart: always
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-medical_biosecurity}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      HIBERNATE_DDL_AUTO: update
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:-MedicalAdmin2026!}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:80}
    ports:
      - "8080:8080"
    networks:
      - med_bio_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
    container_name: med_bio_frontend_prod
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - med_bio_network

networks:
  med_bio_network:
    driver: bridge